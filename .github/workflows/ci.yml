# CI — runs on every push and pull request
# Builds the compiler, runs all tests, and checks formatting.
# Supports x86_64 and ARM64 on Linux, Windows, and macOS.

name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 targets (native)
          - os: Linux
            runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: Windows
            runner: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: macOS
            runner: macos-14
            arch: x86_64
            target: x86_64-apple-darwin
            cross: true
          # ARM64 targets
          - os: macOS
            runner: macos-14
            arch: arm64
            target: aarch64-apple-darwin
          - os: Linux
            runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
          - os: Windows
            runner: windows-latest
            arch: arm64
            target: aarch64-pc-windows-msvc
            cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW UCRT64 sysroot (Windows x86_64)
        if: runner.os == 'Windows' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-sqlite3
          cp -f /c/msys64/ucrt64/bin/libsqlite3-0.dll /c/msys64/ucrt64/bin/sqlite3.dll || true
          echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -yq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq build-essential pkg-config clang lld
          echo "IRIS_CLANG=/usr/bin/clang" >> "$GITHUB_ENV"

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "IRIS_CLANG=$LLVM_PREFIX/bin/clang" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.runner }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.runner }}-${{ matrix.target }}-cargo-

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --verbose --target ${{ matrix.target }}

      - name: Build (cross-compile)
        if: ${{ matrix.cross }}
        run: cargo build --verbose --target ${{ matrix.target }}

      - name: Run tests
        if: ${{ !matrix.cross }}
        run: cargo test --verbose --target ${{ matrix.target }}

      - name: Run tests (cross — build only)
        if: ${{ matrix.cross }}
        run: echo "Cross-compiled target — tests run on native runners only"

  extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-iris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run compile
      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-iris/*.vsix

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release
        run: cargo build --release

      - name: Run benchmarks and collect results
        run: |
          mkdir -p bench-results
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT=$(git rev-parse --short HEAD)
          echo "{" > bench-results/results.json
          echo "  \"timestamp\": \"${TIMESTAMP}\"," >> bench-results/results.json
          echo "  \"commit\": \"${COMMIT}\"," >> bench-results/results.json
          echo "  \"benchmarks\": [" >> bench-results/results.json
          FIRST=true
          for f in benches/*.iris; do
            if [ -f "$f" ]; then
              BENCH_NAME=$(basename "$f" .iris)
              echo "=== Benchmarking $f ==="
              OUTPUT=$(cargo run --release -- bench "$f" -n 20 2>&1 || true)
              # Extract the mean time in ms (the bench command prints it)
              TMP_MEAN=$(echo "$OUTPUT" | grep -oP '[\d.]+\s*ms' | head -1)
              MEAN=$(echo "$TMP_MEAN" | grep -oP '[\d.]+' || echo "0")
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                echo "," >> bench-results/results.json
              fi
              echo "  { \"name\": \"${BENCH_NAME}\"," >> bench-results/results.json
              echo "    \"mean_ms\": ${MEAN:-0} }" >> bench-results/results.json
              echo "$OUTPUT"
              echo ""
            fi
          done
          echo "  ] }" >> bench-results/results.json
          cat bench-results/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench-results/
          retention-days: 90

      - name: Download previous benchmark baseline
        uses: actions/cache@v4
        id: bench-baseline
        with:
          path: bench-baseline/
          key: bench-baseline-${{ runner.os }}
          restore-keys: bench-baseline-

      - name: Check for performance regressions
        run: |
          if [ -f bench-baseline/results.json ]; then
            echo "=== Comparing against baseline ==="
            python3 .github/scripts/compare_benchmarks.py bench-baseline/results.json bench-results/results.json
          else
            echo "No baseline found — this run becomes the baseline."
          fi

      - name: Update baseline
        run: |
          mkdir -p bench-baseline
          cp bench-results/results.json bench-baseline/results.json

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
            fuzz/corpus
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
      - name: Fuzz lexer (60s)
        run: cargo +nightly fuzz run fuzz_lexer -- -max_total_time=60 -max_len=4096
      - name: Fuzz parser (60s)
        run: cargo +nightly fuzz run fuzz_parser -- -max_total_time=60 -max_len=4096
      - name: Fuzz lowerer (60s)
        run: cargo +nightly fuzz run fuzz_lowerer -- -max_total_time=60 -max_len=4096
      - name: Fuzz full compiler (60s)
        run: cargo +nightly fuzz run fuzz_compiler -- -max_total_time=60 -max_len=4096
      - name: Upload fuzz corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ github.sha }}
          path: fuzz/corpus/
          retention-days: 30
