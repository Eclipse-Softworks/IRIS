# Release — triggered when a version tag (v*) is pushed.
# Builds release binaries for all platforms, creates platform installers
# (.deb, .rpm, .pkg, .dmg, portable archives), packages the VS Code extension,
# generates SHA-256 checksums, signs artifacts, and creates a GitHub Release.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # needed to create the GitHub Release
  id-token: write        # needed for sigstore signing
  attestations: write    # needed for artifact attestations

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ───────────────────────────── build matrix ─────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            ext: .exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1        # shallow clone – build.rs only needs HEAD

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation & UI host dev libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download LLVM toolchain
        shell: bash
        run: |
          # Download a minimal LLVM distribution (clang + lld) for the target.
          # We extract only the binaries needed for `iris build` (native compilation).
          LLVM_VER="$(tr -d '\r\n' < LLVM_VERSION)"
          LLVM_MAJOR="${LLVM_VER%%.*}"
          LLVM_BASE="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VER}"

          mkdir -p toolchain-dl

          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)
              LLVM_ARCHIVE="clang+llvm-${LLVM_VER}-x86_64-pc-windows-msvc.tar.xz"
              ;;
            aarch64-pc-windows-msvc)
              LLVM_ARCHIVE="clang+llvm-${LLVM_VER}-aarch64-pc-windows-msvc.tar.xz"
              ;;
            x86_64-unknown-linux-gnu)
              LLVM_ARCHIVE="LLVM-${LLVM_VER}-Linux-X64.tar.xz"
              ;;
            aarch64-unknown-linux-gnu)
              LLVM_ARCHIVE="LLVM-${LLVM_VER}-Linux-ARM64.tar.xz"
              ;;
            x86_64-apple-darwin)
              # Upstream no longer publishes Intel macOS archives. Homebrew
              # builds current LLVM for the Intel runner architecture.
              brew install --quiet llvm
              BREW_LLVM="$(brew --prefix llvm)"
              mkdir -p toolchain-dl/llvm/bin toolchain-dl/llvm/lib
              cp -a "${BREW_LLVM}/bin/"* toolchain-dl/llvm/bin/ 2>/dev/null || true
              cp -a "${BREW_LLVM}/lib/"*.dylib toolchain-dl/llvm/lib/ 2>/dev/null || true
              ;;
            aarch64-apple-darwin)
              LLVM_ARCHIVE="LLVM-${LLVM_VER}-macOS-ARM64.tar.xz"
              ;;
          esac

          if [[ -n "${LLVM_ARCHIVE:-}" ]]; then
            curl -fSL "${LLVM_BASE}/${LLVM_ARCHIVE}" -o toolchain-dl/llvm.tar.xz
            tar xf toolchain-dl/llvm.tar.xz -C toolchain-dl
            LLVM_ROOT="$(find toolchain-dl -mindepth 1 -maxdepth 1 -type d ! -name llvm | head -1)"
            test -n "${LLVM_ROOT}"
            mv "${LLVM_ROOT}" toolchain-dl/llvm
          fi

          CLANG_BIN="toolchain-dl/llvm/bin/clang${{ matrix.ext }}"
          if [[ -f "${CLANG_BIN}" ]] && "${CLANG_BIN}" --version > /dev/null 2>&1; then
            ACTUAL_LLVM_VERSION="$("${CLANG_BIN}" --version | sed -n 's/.*clang version \([0-9][0-9.]*\).*/\1/p' | head -1)"
            case "${ACTUAL_LLVM_VERSION}" in
              ${LLVM_VER}|${LLVM_VER}.*|${LLVM_MAJOR}.*) ;;
              *) echo "Expected LLVM ${LLVM_VER}, found ${ACTUAL_LLVM_VERSION:-unknown}" >&2; exit 1 ;;
            esac
          else
            echo "Expected LLVM ${LLVM_VER} (target archive: ${LLVM_ARCHIVE:-installed})"
          fi

          # Extract only the binaries & shared libs we need: clang, lld, LLVM-C/libLLVM
          mkdir -p toolchain/llvm/bin
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp toolchain-dl/llvm/bin/clang.exe    toolchain/llvm/bin/ 2>/dev/null || true
            cp toolchain-dl/llvm/bin/clang++.exe   toolchain/llvm/bin/ 2>/dev/null || true
            cp "toolchain-dl/llvm/bin/clang-${LLVM_MAJOR}.exe" toolchain/llvm/bin/ 2>/dev/null || true
            cp toolchain-dl/llvm/bin/lld.exe       toolchain/llvm/bin/ 2>/dev/null || true
            cp toolchain-dl/llvm/bin/ld.lld.exe    toolchain/llvm/bin/ 2>/dev/null || true
            cp toolchain-dl/llvm/bin/lld-link.exe  toolchain/llvm/bin/ 2>/dev/null || true
            cp toolchain-dl/llvm/bin/llvm-ar.exe   toolchain/llvm/bin/ 2>/dev/null || true
            cp toolchain-dl/llvm/bin/LLVM-C.dll    toolchain/llvm/bin/ 2>/dev/null || true
            # Copy required DLLs if present
            cp toolchain-dl/llvm/bin/*.dll          toolchain/llvm/bin/ 2>/dev/null || true
            for vc in VCRUNTIME140.dll VCRUNTIME140_1.dll MSVCP140.dll; do
              if [[ -f "C:/Windows/System32/$vc" ]]; then
                cp "C:/Windows/System32/$vc" toolchain/llvm/bin/ 2>/dev/null || true
              fi
            done
          else
            cp -L toolchain-dl/llvm/bin/clang      toolchain/llvm/bin/ 2>/dev/null || true
            cp -L toolchain-dl/llvm/bin/clang++    toolchain/llvm/bin/ 2>/dev/null || true
            cp -L "toolchain-dl/llvm/bin/clang-${LLVM_MAJOR}" toolchain/llvm/bin/ 2>/dev/null || true
            cp -L toolchain-dl/llvm/bin/lld        toolchain/llvm/bin/ 2>/dev/null || true
            cp -L toolchain-dl/llvm/bin/ld.lld     toolchain/llvm/bin/ 2>/dev/null || true
            cp -L toolchain-dl/llvm/bin/llvm-ar    toolchain/llvm/bin/ 2>/dev/null || true
            # Copy required shared libs
            mkdir -p toolchain/llvm/lib
            cp -a toolchain-dl/llvm/lib/libLLVM*.so*  toolchain/llvm/lib/ 2>/dev/null || true
            cp -a toolchain-dl/llvm/lib/libclang*.so* toolchain/llvm/lib/ 2>/dev/null || true
            cp -a toolchain-dl/llvm/lib/liblld*.so*   toolchain/llvm/lib/ 2>/dev/null || true
            cp -a toolchain-dl/llvm/lib/libLLVM*.dylib  toolchain/llvm/lib/ 2>/dev/null || true
            cp -a toolchain-dl/llvm/lib/libclang*.dylib toolchain/llvm/lib/ 2>/dev/null || true
          fi

          # Copy LLVM headers/libs needed for linking (MinGW sysroot on Windows)
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Clang internal headers
            if [[ -d "toolchain-dl/llvm/lib/clang/${LLVM_MAJOR}/include" ]]; then
              mkdir -p "toolchain/llvm/lib/clang/${LLVM_MAJOR}"
              cp -r "toolchain-dl/llvm/lib/clang/${LLVM_MAJOR}/include" "toolchain/llvm/lib/clang/${LLVM_MAJOR}/"
            fi

            # Bundle MinGW ucrt64 sysroot from runner's MSYS2 installation.
            # Without this, clang cannot find standard C headers (stdint.h, etc).
            # Run in a subshell with set +e because Git Bash cp -R can fail on
            # MSYS2 symlinks / Windows paths in unexpected ways.
            (
              set +e   # disable errexit inside this block
              MSYS2_UCRT="C:/msys64/ucrt64"

              # Ensure mingw-w64 headers+libs are installed (runner may have a bare MSYS2).
              # Disable signature validation to bypass outdated keyring errors on the runner.
              sed -i 's/Required/Never/g' C:/msys64/etc/pacman.conf || true
              sed -i 's/Optional/Never/g' C:/msys64/etc/pacman.conf || true

              C:/msys64/usr/bin/pacman.exe -Sy --noconfirm --needed \
                mingw-w64-ucrt-x86_64-headers \
                mingw-w64-ucrt-x86_64-crt \
                mingw-w64-ucrt-x86_64-gcc \
                mingw-w64-ucrt-x86_64-gcc-libs \
                mingw-w64-ucrt-x86_64-winpthreads 2>&1 || true

              if [[ -d "$MSYS2_UCRT/include" ]]; then
                echo "  Bundling MinGW ucrt64 sysroot..."

                # Headers — use robocopy (Windows-native, handles NTFS paths properly)
                mkdir -p toolchain/ucrt64/include
                # robocopy exit codes 0-7 = success; mask with (( )) to avoid bash error
                robocopy.exe "C:\\msys64\\ucrt64\\include" "toolchain\\ucrt64\\include" /E /NFL /NDL /NP /NJH /NJS 2>&1 || true

                # Verify headers were copied
                if [[ -f "toolchain/ucrt64/include/stdint.h" ]]; then
                  echo "  Headers copied OK"
                else
                  echo "  WARNING: Headers copy may have failed (stdint.h not found)"
                fi

                # Essential link libraries
                mkdir -p toolchain/ucrt64/lib
                for f in libmingw32.a libmingwex.a libmsvcrt.a libucrt.a \
                         libpthread.a libm.a libkernel32.a libuser32.a \
                         libadvapi32.a libshell32.a libws2_32.a libole32.a \
                         liboleaut32.a libuuid.a libmoldname.a \
                         crt2.o crtbegin.o crtend.o gcrt2.o dllcrt2.o \
                         libntdll.a libshlwapi.a libversion.a \
                         libgdi32.a libbcrypt.a libuserenv.a libiphlpapi.a; do
                  cp "$MSYS2_UCRT/lib/$f" toolchain/ucrt64/lib/ 2>/dev/null || true
                done

                # GCC CRT support files (crtbegin.o, libgcc.a, etc.)
                GCC_LIB_DIR=$(find "$MSYS2_UCRT/lib/gcc/x86_64-w64-mingw32" -maxdepth 1 -type d 2>/dev/null | sort -rV | head -1)
                if [[ -n "$GCC_LIB_DIR" ]]; then
                  GCC_VER=$(basename "$GCC_LIB_DIR")
                  mkdir -p "toolchain/ucrt64/lib/gcc/x86_64-w64-mingw32/$GCC_VER"
                  find "$GCC_LIB_DIR" -maxdepth 1 \( -name '*.o' -o -name '*.a' \) \
                    -exec cp {} "toolchain/ucrt64/lib/gcc/x86_64-w64-mingw32/$GCC_VER/" \; 2>/dev/null || true
                fi

                echo "  ucrt64 sysroot bundled: $(du -sh toolchain/ucrt64 2>/dev/null | awk '{print $1}')"
              else
                echo "  WARNING: MSYS2 ucrt64 include dir not found at $MSYS2_UCRT/include"
              fi
            ) || true  # ensure subshell failure never kills the step
          fi

          # Cleanup the large download
          rm -rf toolchain-dl

          echo "--- Toolchain contents ---"
          find toolchain -type f | head -30
          du -sh toolchain/

      - name: Generate prebuilt C runtime objects (native hosts)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          export IRIS_CLANG="$PWD/toolchain/llvm/bin/clang${{ matrix.ext }}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            export IRIS_MSYS2_INCLUDE="$PWD/toolchain/ucrt64/include"
          else
            export LD_LIBRARY_PATH="$PWD/toolchain/llvm/lib:${LD_LIBRARY_PATH:-}"
            export DYLD_LIBRARY_PATH="$PWD/toolchain/llvm/lib:${DYLD_LIBRARY_PATH:-}"
          fi
          IRIS_GENERATE_PREBUILT=1 cargo check --target ${{ matrix.target }}

      - name: Build release binary and UI host
        shell: bash
        run: |
          IRIS_WATCH_GIT=1 cargo build --release --target ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            cargo build --release -p iris_ui_host --target ${{ matrix.target }} || \
              echo "Skipping iris_ui_host on cross ARM64 Linux target without ARM64 X11/Wayland dev sysroot"
          else
            cargo build --release -p iris_ui_host --target ${{ matrix.target }}
          fi

      - name: Sign Windows binaries (optional)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_DLIB: ${{ secrets.AZURE_TRUSTED_SIGNING_DLIB }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & installer\windows\sign_windows.ps1 -Files `
            "target\${{ matrix.target }}\release\iris.exe", `
            "target\${{ matrix.target }}\release\iris_ui_host.dll"

      - name: Sign macOS binaries (optional)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          mkdir -p macos-sign-stage
          cp -a "target/${{ matrix.target }}/release/iris" macos-sign-stage/
          if [[ -f "target/${{ matrix.target }}/release/libiris_ui_host.dylib" ]]; then
            cp -a "target/${{ matrix.target }}/release/libiris_ui_host.dylib" macos-sign-stage/
          fi
          chmod +x installer/macos/sign_and_notarize.sh
          bash installer/macos/sign_and_notarize.sh sign-binaries macos-sign-stage
          cp -a macos-sign-stage/* "target/${{ matrix.target }}/release/"
          rm -rf macos-sign-stage
          if [[ -d "toolchain" ]]; then
            bash installer/macos/sign_and_notarize.sh sign-binaries toolchain
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          BIN="iris${{ matrix.ext }}"
          ARCHIVE="iris-${TAG}-${{ matrix.target }}"
          LIGHT_ARCHIVE="iris-${TAG}-${{ matrix.target }}-lightweight"

          # 1. Stage lightweight assets (relocatable bin/ + share/iris/ layout)
          mkdir -p staging-light/bin staging-light/share/iris
          cp "target/${{ matrix.target }}/release/${BIN}" staging-light/bin/
          for ui_lib in iris_ui_host.dll libiris_ui_host.so libiris_ui_host.dylib; do
            if [[ -f "target/${{ matrix.target }}/release/${ui_lib}" ]]; then
              cp "target/${{ matrix.target }}/release/${ui_lib}" staging-light/bin/
            fi
          done
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            for vc in VCRUNTIME140.dll VCRUNTIME140_1.dll MSVCP140.dll; do
              if [[ -f "C:/Windows/System32/$vc" ]]; then
                cp "C:/Windows/System32/$vc" staging-light/bin/
              fi
            done
          fi
          cp -r examples staging-light/ 2>/dev/null || true
          cp LICENSE staging-light/
          cp LLVM_VERSION staging-light/
          cp LLVM_VERSION staging-light/share/iris/
          if [[ -f installer/icon.png ]]; then cp installer/icon.png staging-light/share/iris/iris.png; fi
          if [[ -f installer/icon.ico ]]; then cp installer/icon.ico staging-light/share/iris/iris.ico; fi

          # 2. Stage full assets (with bundled toolchain if present)
          mkdir -p staging
          cp -r staging-light/* staging/
          if [[ -d "toolchain" ]]; then
            cp -r toolchain staging/
            echo "  Bundled LLVM toolchain in full release"
          fi

          # 3. Compress both variants
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a "${ARCHIVE}.zip" ./staging/*
            7z a "${LIGHT_ARCHIVE}.zip" ./staging-light/*
            echo "ASSET=${ARCHIVE}.zip" >> "$GITHUB_ENV"
            echo "LIGHT_ASSET=${LIGHT_ARCHIVE}.zip" >> "$GITHUB_ENV"
          else
            tar czf "${ARCHIVE}.tar.gz" -C staging .
            tar czf "${LIGHT_ARCHIVE}.tar.gz" -C staging-light .
            echo "ASSET=${ARCHIVE}.tar.gz" >> "$GITHUB_ENV"
            echo "LIGHT_ASSET=${LIGHT_ARCHIVE}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

      - name: Upload lightweight artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-lightweight
          path: ${{ env.LIGHT_ASSET }}

  # ─────────────────────── platform installers ────────────────────────────
  installers:
    name: Installers (${{ matrix.installer }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 .deb
          - installer: linux-x64-deb
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            format: deb
            arch: x86_64
          # Linux ARM64 .deb
          - installer: linux-arm64-deb
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            format: deb
            arch: aarch64
          # Linux x64 .rpm
          - installer: linux-x64-rpm
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            format: rpm
            arch: x86_64
          # Linux ARM64 .rpm
          - installer: linux-arm64-rpm
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            format: rpm
            arch: aarch64
          # macOS x64 .pkg
          - installer: macos-x64-pkg
            os: macos-latest
            target: x86_64-apple-darwin
            format: pkg
            arch: x86_64
          # macOS ARM64 .pkg
          - installer: macos-arm64-pkg
            os: macos-latest
            target: aarch64-apple-darwin
            format: pkg
            arch: aarch64
          # macOS x64 .dmg
          - installer: macos-x64-dmg
            os: macos-latest
            target: x86_64-apple-darwin
            format: dmg
            arch: x86_64
          # macOS ARM64 .dmg
          - installer: macos-arm64-dmg
            os: macos-latest
            target: aarch64-apple-darwin
            format: dmg
            arch: aarch64
          # Windows x64 portable .zip
          - installer: windows-x64-portable
            os: windows-latest
            target: x86_64-pc-windows-msvc
            format: portable
            arch: x86_64
          # Windows ARM64 portable .zip
          - installer: windows-arm64-portable
            os: windows-latest
            target: aarch64-pc-windows-msvc
            format: portable
            arch: aarch64
          # Windows x64 Inno Setup installer (.exe)
          - installer: windows-x64-installer
            os: windows-latest
            target: x86_64-pc-windows-msvc
            format: installer
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: build-artifact

      - name: Extract binary from artifact
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

          mkdir -p extracted
          ARTIFACT=$(ls build-artifact/)
          if [[ "$ARTIFACT" == *.tar.gz ]]; then
            tar xzf "build-artifact/$ARTIFACT" -C extracted
          elif [[ "$ARTIFACT" == *.zip ]]; then
            cd build-artifact && 7z x "$ARTIFACT" -o../extracted && cd ..
          fi

          # Find the iris binary
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN=$(find extracted -name 'iris.exe' -type f | head -1)
          else
            BIN=$(find extracted -name 'iris' -type f ! -name '*.iris' | head -1)
          fi

          if [ -z "$BIN" ]; then
            echo "ERROR: Could not find iris binary in artifact"
            ls -laR extracted/
            exit 1
          fi

          mkdir -p target/release
          cp "$BIN" "target/release/"
          chmod +x "target/release/iris" 2>/dev/null || true

          # Copy bundled UI host library if present
          for ui_name in iris_ui_host.dll libiris_ui_host.so libiris_ui_host.dylib; do
            UI_FOUND=$(find extracted -name "$ui_name" -type f | head -1 || true)
            if [ -n "$UI_FOUND" ]; then
              cp "$UI_FOUND" "target/release/"
              chmod 755 "target/release/$ui_name" 2>/dev/null || true
              echo "  Copied $ui_name -> target/release/"
            fi
          done

          # Extract the bundled LLVM toolchain so installer scripts can package it.
          if [[ -d "extracted/toolchain" ]]; then
            cp -r extracted/toolchain toolchain
            echo "  Toolchain extracted ($(du -sh toolchain | awk '{print $1}'))"
          fi

      # ── Linux .deb ──
      - name: Build .deb package
        if: matrix.format == 'deb'
        run: |
          chmod +x installer/linux/build-deb.sh
          bash installer/linux/build-deb.sh \
            --version "$VERSION" --arch "${{ matrix.arch }}"

      # ── Linux .rpm ──
      - name: Install rpmbuild
        if: matrix.format == 'rpm'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build .rpm package
        if: matrix.format == 'rpm'
        run: |
          chmod +x installer/linux/build-rpm.sh
          bash installer/linux/build-rpm.sh \
            --version "$VERSION" --arch "${{ matrix.arch }}"

      # ── macOS .pkg ──
      - name: Build .pkg installer
        if: matrix.format == 'pkg'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          chmod +x installer/macos/build-pkg.sh
          bash installer/macos/build-pkg.sh --version "$VERSION"

      - name: Sign & notarize .pkg (optional)
        if: matrix.format == 'pkg'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x installer/macos/sign_and_notarize.sh
          for pkg in installer/dist/*.pkg; do
            [[ -f "$pkg" ]] && bash installer/macos/sign_and_notarize.sh notarize-installer "$pkg"
          done

      # ── macOS .dmg ──
      - name: Build .dmg image
        if: matrix.format == 'dmg'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          chmod +x installer/macos/build-dmg.sh
          bash installer/macos/build-dmg.sh --version "$VERSION"

      - name: Sign & notarize .dmg (optional)
        if: matrix.format == 'dmg'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x installer/macos/sign_and_notarize.sh
          for dmg in installer/dist/*.dmg; do
            [[ -f "$dmg" ]] && bash installer/macos/sign_and_notarize.sh notarize-installer "$dmg"
          done

      # ── Windows portable .zip ──
      - name: Build portable .zip
        if: matrix.format == 'portable'
        shell: pwsh
        run: |
          & installer\windows\build_portable.ps1 `
            -Version $env:VERSION -SkipBuild

      # ── Windows x64 Inno Setup installer (.exe) ──
      - name: Build Windows .exe installer
        if: matrix.format == 'installer'
        shell: pwsh
        run: |
          & installer\build_installer.ps1 `
            -Version $env:VERSION -SkipBuild

      - name: Sign Windows .exe installer (optional)
        if: matrix.format == 'installer'
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_DLIB: ${{ secrets.AZURE_TRUSTED_SIGNING_DLIB }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $exes = @(Get-ChildItem installer\dist\*.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if ($exes.Count -gt 0) {
            & installer\windows\sign_windows.ps1 -Files $exes
          }

      - name: Collect installer output
        shell: bash
        run: |
          mkdir -p installer-output
          find installer/dist -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg' \
               -o -name '*.dmg' -o -name '*portable*.zip' -o -name '*.exe' \) \
            -exec cp {} installer-output/ \;

          echo "--- Installer artifacts ---"
          ls -lh installer-output/

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.installer }}
          path: installer-output/*

  # ─────────────────────────── VS Code extension ──────────────────────────
  extension:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-iris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-iris/*.vsix

  # ──────────────────────────── GitHub Release ────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build, installers, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd artifacts
          # Collect all release files into one directory
          mkdir -p ../release-files
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.vsix' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg' -o -name '*.dmg' \
            -o -name '*.exe' \) \
            -exec cp {} ../release-files/ \;
          cd ../release-files
          sha256sum * > SHA256SUMS.txt
          echo "--- SHA-256 Checksums ---"
          cat SHA256SUMS.txt

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          {
            echo "## IRIS ${TAG}"
            echo ""
            echo "### Binary Archives"
            echo "| Platform | Full Bundle (with LLVM) | Lightweight Update (no LLVM) |"
            echo "|----------|-------------|----------------------------|"
            echo "| Windows x64   | \`iris-${TAG}-x86_64-pc-windows-msvc.zip\` | \`iris-${TAG}-x86_64-pc-windows-msvc-lightweight.zip\` |"
            echo "| Windows ARM64 | \`iris-${TAG}-aarch64-pc-windows-msvc.zip\` | \`iris-${TAG}-aarch64-pc-windows-msvc-lightweight.zip\` |"
            echo "| Linux x64     | \`iris-${TAG}-x86_64-unknown-linux-gnu.tar.gz\` | \`iris-${TAG}-x86_64-unknown-linux-gnu-lightweight.tar.gz\` |"
            echo "| Linux ARM64   | \`iris-${TAG}-aarch64-unknown-linux-gnu.tar.gz\` | \`iris-${TAG}-aarch64-unknown-linux-gnu-lightweight.tar.gz\` |"
            echo "| macOS x64     | \`iris-${TAG}-x86_64-apple-darwin.tar.gz\` | \`iris-${TAG}-x86_64-apple-darwin-lightweight.tar.gz\` |"
            echo "| macOS ARM64   | \`iris-${TAG}-aarch64-apple-darwin.tar.gz\` | \`iris-${TAG}-aarch64-apple-darwin-lightweight.tar.gz\` |"
            echo ""
            echo "### Platform Installers"
            echo "| Platform | Installer | Install command |"
            echo "|----------|-----------|-----------------|"
            echo "| Linux x64   | \`iris_${VERSION}_x86_64.deb\` | \`sudo dpkg -i iris_${VERSION}_x86_64.deb\` |"
            echo "| Linux ARM64 | \`iris_${VERSION}_aarch64.deb\` | \`sudo dpkg -i iris_${VERSION}_aarch64.deb\` |"
            echo "| Linux x64   | \`iris-${VERSION}-1.x86_64.rpm\` | \`sudo rpm -i iris-${VERSION}-1.x86_64.rpm\` |"
            echo "| Linux ARM64 | \`iris-${VERSION}-1.aarch64.rpm\` | \`sudo rpm -i iris-${VERSION}-1.aarch64.rpm\` |"
            echo "| macOS x64   | \`IRIS-${VERSION}-macos-x86_64.pkg\` | Double-click or \`sudo installer -pkg ... -target /\` |"
            echo "| macOS ARM64 | \`IRIS-${VERSION}-macos-aarch64.pkg\` | Double-click or \`sudo installer -pkg ... -target /\` |"
            echo "| macOS x64   | \`IRIS-${VERSION}-macos-x86_64.dmg\` | Mount and run Install script |"
            echo "| macOS ARM64 | \`IRIS-${VERSION}-macos-aarch64.dmg\` | Mount and run Install script |"
            echo "| Windows x64 | \`IRIS-${VERSION}-windows-x86_64-portable.zip\` | Extract and add to PATH |"
            echo "| Windows ARM64 | \`IRIS-${VERSION}-windows-aarch64-portable.zip\` | Extract and add to PATH |"
            echo "| Windows x64 | \`IRIS-${VERSION}-windows-x64-setup.exe\` | GUI installer (auto-downloads missing LLVM/MinGW/Git/MSVC) |"
            echo ""
            echo "### VS Code Extension"
            echo "\`\`\`bash"
            echo "code --install-extension iris-lang-*.vsix"
            echo "\`\`\`"
            echo ""
            echo "### One-line install (downloads latest + bundled LLVM toolchain & UI host)"
            echo "**Linux & macOS:**"
            echo "\`\`\`bash"
            echo "curl -fsSL https://raw.githubusercontent.com/Eclipse-Softworks/IRIS/${TAG}/installer/install.sh | bash"
            echo "\`\`\`"
            echo "**Windows (PowerShell):**"
            echo "\`\`\`powershell"
            echo "irm https://raw.githubusercontent.com/Eclipse-Softworks/IRIS/${TAG}/installer/install.ps1 | iex"
            echo "\`\`\`"
            echo ""
            echo "### Verify integrity"
            echo "Download \`SHA256SUMS.txt\` and verify:"
            echo "\`\`\`bash"
            echo "sha256sum -c SHA256SUMS.txt"
            echo "\`\`\`"
            echo ""
            echo "### Quick start"
            echo "\`\`\`"
            echo "iris --version"
            echo "iris doctor"
            echo "\`\`\`"
            echo ""
            echo "Full changelog: https://github.com/Eclipse-Softworks/IRIS/compare/...${TAG}"
          } > release_body.md

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-files/*'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            release-files/*.zip
            release-files/*.tar.gz
            release-files/*.vsix
            release-files/*.deb
            release-files/*.rpm
            release-files/*.pkg
            release-files/*.dmg
            release-files/*.exe
            release-files/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload SHA256SUMS artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: release-files/SHA256SUMS.txt

  # ─────────────────────── Post-Release Publishing ─────────────────────────
  publish-extension:
    name: Publish VS Code Extension (Marketplace & Open VSX)
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix

      - name: Publish to VS Code Marketplace (optional)
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "[skip] VSCE_PAT not configured."
            exit 0
          fi
          VSIX_FILE="$(ls vsix/*.vsix | head -1)"
          npx --yes @vscode/vsce publish --packagePath "$VSIX_FILE" -p "$VSCE_PAT"

      - name: Publish to Open VSX (optional)
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo "[skip] OVSX_PAT not configured."
            exit 0
          fi
          VSIX_FILE="$(ls vsix/*.vsix | head -1)"
          npx --yes ovsx publish "$VSIX_FILE" -p "$OVSX_PAT"

  publish-package-managers:
    name: Generate & Publish Package Manager Manifests
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download SHA256SUMS artifact
        uses: actions/download-artifact@v4
        with:
          name: sha256sums
          path: sums

      - name: Generate & validate manifests
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 packaging/generate_manifests.py \
            --version "$VERSION" \
            --sums sums/SHA256SUMS.txt \
            --out dist-manifests \
            --check

      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: dist-manifests

      - name: Publish Homebrew formula (optional)
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "[skip] HOMEBREW_TAP_TOKEN not configured."
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Eclipse-Softworks/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Formula
          cp dist-manifests/homebrew/iris.rb tap-repo/Formula/iris.rb
          cd tap-repo
          git config user.name "iris-release-bot"
          git config user.email "release-bot@eclipsesoftworks.dev"
          git add Formula/iris.rb
          git diff --cached --quiet || (git commit -m "iris ${TAG}" && git push origin HEAD)

      - name: Publish Scoop manifest (optional)
        shell: bash
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [[ -z "${SCOOP_BUCKET_TOKEN:-}" ]]; then
            echo "[skip] SCOOP_BUCKET_TOKEN not configured."
            exit 0
          fi
          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/Eclipse-Softworks/scoop-bucket.git" scoop-repo
          mkdir -p scoop-repo/bucket
          cp dist-manifests/scoop/iris.json scoop-repo/bucket/iris.json
          cd scoop-repo
          git config user.name "iris-release-bot"
          git config user.email "release-bot@eclipsesoftworks.dev"
          git add bucket/iris.json
          git diff --cached --quiet || (git commit -m "iris: Update to version ${VERSION}" && git push origin HEAD)

      - name: Check Winget publish configuration
        id: winget-cfg
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [[ -n "${WINGET_TOKEN:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "[skip] WINGET_TOKEN not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit Winget PR (optional)
        if: steps.winget-cfg.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: EclipseSoftworks.IRIS
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  publish-linux-repos:
    name: Build Static APT & RPM Repositories
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux installer packages
        uses: actions/download-artifact@v4
        with:
          pattern: installer-linux-*
          path: linux-pkgs

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c gnupg

      - name: Build APT & RPM repositories
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -n "${GPG_PRIVATE_KEY:-}" && -n "${GPG_KEY_ID:-}" ]]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          chmod +x packaging/linux-repo/build-repos.sh
          bash packaging/linux-repo/build-repos.sh linux-pkgs linux-repo-out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-apt-rpm-repo
          path: linux-repo-out
